[package]
name = "csusage"
version = "0.4.10"
edition.workspace = true
build = "build.rs"
publish.workspace = true
license.workspace = true
description.workspace = true

[[bin]]
name = "csusage"
path = "src/main.rs"

[features]
# Enabled by the Windows release build, which cannot get the pricing snapshot
# from the pinned Nix input the way every other platform does.
fetch-litellm-pricing = ["csusage-core/fetch-litellm-pricing"]

[dependencies]
csusage-adapter-all.workspace = true
csusage-adapter-amp.workspace = true
csusage-adapter-antigravity.workspace = true
csusage-adapter-claude.workspace = true
csusage-adapter-claude-science.workspace = true
csusage-adapter-openhands.workspace = true
csusage-adapter-dsh.workspace = true
csusage-adapter-codebuff.workspace = true
csusage-adapter-codex.workspace = true
csusage-adapter-common.workspace = true
csusage-adapter-copilot.workspace = true
csusage-adapter-droid.workspace = true
csusage-adapter-gemini.workspace = true
csusage-adapter-goose.workspace = true
csusage-adapter-grok.workspace = true
csusage-adapter-hermes.workspace = true
csusage-adapter-kilo.workspace = true
csusage-adapter-kimi.workspace = true
csusage-adapter-openclaw.workspace = true
csusage-adapter-opencode.workspace = true
csusage-adapter-pi.workspace = true
csusage-adapter-qwen.workspace = true
csusage-adapter-zcode.workspace = true
csusage-cli-parser.workspace = true
csusage-cli.workspace = true
csusage-config.workspace = true
csusage-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
csusage-test-support.workspace = true
insta.workspace = true
sqlite.workspace = true

# mimalloc measurably beats the musl allocator on the static Linux build's
# allocation-heavy JSONL parsing.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc.workspace = true
