[workspace]
# adapters/ holds the per-source adapters plus the helpers they share; crates/ holds
# everything that is not tied to a single source, including the unified report.
# Both are globs so a layer can be built from a filtered source tree containing
# only some crates — a glob that matches nothing is an error, which is why
# csusage-adapter-common lives with the adapters: every layer includes it.
members = ["adapters/*", "crates/*"]
resolver = "2"

# Every workspace crate inherits these, so a version or edition bump is one edit.
[workspace.package]
version = "0.0.23"
edition = "2024"
publish = true
license = "MIT"
description = "Coding agent CLI usage reports (ccusage fork with Claude Science support)"
repository = "https://github.com/maokangkun/ccusage"

# Shared dependency specs. Crates opt in with `<dep>.workspace = true`, which keeps
# the per-crate manifests to a list of what that crate actually uses.
[workspace.dependencies]
csusage-adapter-all = { path = "crates/ccusage-adapter-all", version = "0.0.23" }
csusage-adapter-amp = { path = "adapters/amp", version = "0.0.23" }
csusage-adapter-antigravity = { path = "adapters/antigravity", version = "0.0.23" }
csusage-adapter-claude = { path = "adapters/claude", version = "0.0.23" }
csusage-adapter-claude-science = { path = "adapters/claude-science", version = "0.0.23" }
csusage-adapter-openhands = { path = "adapters/openhands", version = "0.0.23" }
csusage-adapter-dsh = { path = "adapters/dsh", version = "0.0.23" }
zstd = "0.13"
csusage-adapter-codebuff = { path = "adapters/codebuff", version = "0.0.23" }
csusage-adapter-codex = { path = "adapters/codex", version = "0.0.23" }
csusage-adapter-common = { path = "adapters/common", version = "0.0.23" }
csusage-adapter-copilot = { path = "adapters/copilot", version = "0.0.23" }
csusage-adapter-droid = { path = "adapters/droid", version = "0.0.23" }
csusage-adapter-gemini = { path = "adapters/gemini", version = "0.0.23" }
csusage-adapter-goose = { path = "adapters/goose", version = "0.0.23" }
csusage-adapter-grok = { path = "adapters/grok", version = "0.0.23" }
csusage-adapter-hermes = { path = "adapters/hermes", version = "0.0.23" }
csusage-adapter-kilo = { path = "adapters/kilo", version = "0.0.23" }
csusage-adapter-kimi = { path = "adapters/kimi", version = "0.0.23" }
csusage-adapter-openclaw = { path = "adapters/openclaw", version = "0.0.23" }
csusage-adapter-opencode = { path = "adapters/opencode", version = "0.0.23" }
csusage-adapter-pi = { path = "adapters/pi", version = "0.0.23" }
csusage-adapter-qwen = { path = "adapters/qwen", version = "0.0.23" }
csusage-adapter-zcode = { path = "adapters/zcode", version = "0.0.23" }
csusage-cli = { path = "crates/ccusage-cli", version = "0.0.23" }
csusage-cli-parser = { path = "crates/ccusage-cli-parser", version = "0.0.23" }
csusage-config = { path = "crates/ccusage-config", version = "0.0.23" }
csusage-core = { path = "crates/ccusage-core", version = "0.0.23" }
csusage-terminal = { path = "crates/ccusage-terminal", version = "0.0.23" }
csusage-test-support = { path = "crates/ccusage-test-support", version = "0.0.23" }
assert_fs = "1.1.4"
compact_str = "0.10.0"
insta = { version = "1.48.0", features = ["json"] }
jiff = { version = "0.2.35", default-features = false, features = [
	"std",
	"tz-system",
	"tzdb-zoneinfo",
	"tzdb-bundle-platform",
] }
memchr = "2.8.3"
# Inflate-only consumer of the deflated pricing snapshots build.rs embeds; the
# compression side is a build-dependency of csusage-core.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
mimalloc = "0.1.52"
minreq = { version = "3.0.0", default-features = false, features = ["https-rustls", "proxy"] }
rustc-hash = "2.1.3"
schemars = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.15.2"
sqlite = { version = "0.37.0", default-features = false, features = ["bundled", "linkage"] }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = "s"
